name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ "amd-main" ]
  pull_request:
    branches: [ "amd-main" ]
  schedule:
    - cron: '35 9 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }} - ${{ matrix.compiler }})
    runs-on: amd_linux
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
          compiler: gcc
        - language: c-cpp
          build-mode: manual
          compiler: aocc
        - language: python
          build-mode: none
          compiler: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    # Build with GCC
    - name: Build with GCC
      if: matrix.build-mode == 'manual' && matrix.compiler == 'gcc'
      shell: bash
      run: |
        export PATH=/usr/local/bin:$PATH
        export CC=gcc
        export CXX=g++
        export gcc_path=$(which gcc)
        cmake --preset dev-release-gcc --fresh
        cmake --build --preset dev-release-gcc -j16

    # Build with AOCC
    - name: Build with AOCC
      if: matrix.build-mode == 'manual' && matrix.compiler == 'aocc'
      shell: bash
      run: |
        export PATH=/usr/local/bin:$PATH
        export PATH="/home/amd/aocc-compiler-5.2.0/bin:$PATH"
        export CC=clang
        export CXX=clang++
        export LIBRARY_PATH=/usr/lib64:/usr/lib/x86_64-linux-gnu:/usr/lib:$LIBRARY_PATH
        export LD_LIBRARY_PATH=/usr/lib64:/usr/lib/x86_64-linux-gnu:/usr/lib:$LD_LIBRARY_PATH
        export PATH=/home/amd/aocc-compiler-5.2.0/share/opt-viewer:$PATH
        export LIBRARY_PATH=/home/amd/aocc-compiler-5.2.0/lib:/home/amd/aocc-compiler-5.2.0/lib32:$LIBRARY_PATH
        export LD_LIBRARY_PATH=/home/amd/aocc-compiler-5.2.0/ompd:/home/amd/aocc-compiler-5.2.0/lib:/home/amd/aocc-compiler-5.2.0/lib32:$LD_LIBRARY_PATH
        cmake --preset dev-release-clang --fresh
        cmake --build --preset dev-release-clang -j16

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}/compiler:${{matrix.compiler}}"
