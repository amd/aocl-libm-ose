---
- test_sequence: perf_tests_asin_fast
  function: asin
  timing_enabled: true
  test_sets:
  - id: double-precision-tests
    description: 'Curve-region performance tests for fast asin (double precision)'
    tests:
    # Subnormal: asin(x) ≈ x exactly
    - id: asin_d01
      description: 'Subnormal inputs, asin(x) = x'
      input:
      - [0x0000000000000001, 0x000fffffffffffff]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Tiny positive: asin(x) ≈ x
    - id: asin_d02
      description: 'Tiny positive, asin(x) ≈ x, linear'
      input:
      - [0x000fffffffffffff, 0x3e45798ee2308c3a]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Small: near-linear with cubic correction
    - id: asin_d03
      description: 'Small, asin(x) ≈ x + x³/6'
      input:
      - [0x3e45798ee2308c3a, 0x3fc0000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Moderate: direct polynomial path (|x| ≤ 0.5)
    - id: asin_d04
      description: 'Moderate, direct polynomial, |x| ≤ 0.5'
      input:
      - [0x3fc0000000000000, 0x3fe0000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Above split: sqrt-based path (|x| > 0.5)
    - id: asin_d05
      description: 'Above 0.5 split, sqrt path begins'
      input:
      - [0x3fe0000000000000, 0x3fe8000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Near 1: steep approach to π/2
    - id: asin_d06
      description: 'Near 1, steep approach to π/2'
      input:
      - [0x3fe8000000000000, 0x3fef000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Very near 1: asin(x) → π/2
    - id: asin_d07
      description: 'Very near 1, asin(x) → π/2'
      input:
      - [0x3fef000000000000, 0x3ff0000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Negative: near-zero through polynomial path
    - id: asin_d08
      description: 'Negative, [−0.5, −min_normal], near-zero + polynomial'
      input:
      - [0xbfe0000000000000, 0x8010000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Negative above split: sqrt path
    - id: asin_d09
      description: 'Negative above split, [−0.75, −0.5], sqrt path'
      input:
      - [0xbfe8000000000000, 0xbfe0000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Near −1: asin(x) → −π/2
    - id: asin_d10
      description: 'Near −1, [−1.0, −0.75], asin(x) → −π/2'
      input:
      - [0xbff0000000000000, 0xbfe8000000000000]
      type: [expstep]
      steps: [500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

  - id: single-precision-tests
    description: 'Curve-region performance tests for fast asinf (single precision)'
    tests:
    # Subnormal float inputs
    - id: asin_s01
      description: 'Subnormal inputs, asinf(x) = x'
      input:
      - [0x36a0000000000000, 0x380fffffc0000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Tiny
    - id: asin_s02
      description: 'Tiny positive, asinf(x) ≈ x'
      input:
      - [0x380fffffc0000000, 0x3f1a36e2eb1c432d]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Small to moderate: polynomial
    - id: asin_s03
      description: 'Small to moderate, polynomial path'
      input:
      - [0x3f1a36e2eb1c432d, 0x3fe0000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Above split: sqrt path
    - id: asin_s04
      description: 'Above 0.5 split, sqrt path'
      input:
      - [0x3fe0000000000000, 0x3fe8000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Near 1
    - id: asin_s05
      description: 'Near 1, steep approach to π/2'
      input:
      - [0x3fe8000000000000, 0x3fef000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Very near 1
    - id: asin_s06
      description: 'Very near 1, asinf → π/2'
      input:
      - [0x3fef000000000000, 0x3ff0000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Negative: near-zero through polynomial
    - id: asin_s07
      description: 'Negative, [−0.5, −flt_sub_min], near-zero + polynomial'
      input:
      - [0xbfe0000000000000, 0xb6a0000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Negative above split
    - id: asin_s08
      description: 'Negative above split, [−0.75, −0.5], sqrt path'
      input:
      - [0xbfe8000000000000, 0xbfe0000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Near −1
    - id: asin_s09
      description: 'Near −1, [−0.96875, −0.75]'
      input:
      - [0xbfef000000000000, 0xbfe8000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000

    # Very near −1
    - id: asin_s10
      description: 'Very near −1, [−1.0, −0.96875], asinf → −π/2'
      input:
      - [0xbff0000000000000, 0xbfef000000000000]
      type: [expstep]
      steps: [500]
      variants: [ss]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
