---
- test_sequence: validation_tests_atan2
  function: atan2
  test_sets:
  - id: range-tests_01
    description: 'Full value distribution range tests'
    tests:
    - id: atan2_001
      description: 'y in [-FLT_MAX, -SMALLEST_SUBNORMAL], x in [-FLT_MAX, -SMALLEST_SUBNORMAL]
        expstep'
      input:
      - [0xFF7FFFFF, -min_subnormal]
      - [0xFF7FFFFF, -min_subnormal]
      type: [expstep, expstep]
      steps: [500, 500]
      variants : [ss]

    - id: atan2_002
      description: 'y in [SMALLEST_SUBNORMAL, +FLT_MAX], x in [-FLT_MAX, -SMALLEST_SUBNORMAL]
        expstep'
      input:
      - [min_subnormal, max]
      - [0xFF7FFFFF, -min_subnormal]
      type: [expstep, expstep]
      steps: [500, 500]
      variants : [ss]

    - id: atan2_003
      description: 'y in [-FLT_MAX, -SMALLEST_SUBNORMAL], x in [SMALLEST_SUBNORMAL, +FLT_MAX]
        expstep'
      input:
      - [0xFF7FFFFF, -min_subnormal]
      - [min_subnormal, max]
      type: [expstep, expstep]
      steps: [500, 500]
      variants : [ss]

    - id: atan2_004
      description: 'y in [SMALLEST_SUBNORMAL, +FLT_MAX], x in [SMALLEST_SUBNORMAL, +FLT_MAX]
        expstep'
      input:
      - [min_subnormal, max]
      - [min_subnormal, max]
      type: [expstep, expstep]
      steps: [500, 500]
      variants : [ss]

  - id: normal-range
    description: 'Common value usage range tests'
    tests:
    - id: atan2_005
      description: 'y, x in [-1, 0] linearstep'
      input:
      - [-1.0, 0.0]
      - [-1.0, 0.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [ss]

    - id: atan2_006
      description: 'y in [-1, 0], x in [0, +1] linearstep'
      input:
      - [-1.0, 0.0]
      - [0.0, 1.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [ss]

    - id: atan2_007
      description: 'y in [0, +1], x in [-1, 0] linearstep'
      input:
      - [0.0, 1.0]
      - [-1.0, 0.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [ss]

    - id: atan2_008
      description: 'y, x in [0, +1] linearstep'
      input:
      - [0.0, 1.0]
      - [0.0, 1.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [ss]

  - id: subnormal-range
    description: 'Subnormal values range test'
    tests:
    - id: atan2_009
      description: 'y, x in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL] linearstep'
      input:
      - [-max_subnormal, max_subnormal]
      - [-max_subnormal, max_subnormal]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [ss]

    - id: atan2_010
      description: 'x in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL], y in [1, 100] linearstep'
      input:
      - [1.0, 100.0]
      - [-max_subnormal, max_subnormal]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [ss]

    - id: atan2_011
      description: 'x in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL], y in [-100, -1] linearstep'
      input:
      - [-100.0, -1.0]
      - [-max_subnormal, max_subnormal]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [ss]

    - id: atan2_012
      description: 'x in [1, 100], y in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL] linearstep'
      input:
      - [-max_subnormal, max_subnormal]
      - [1.0, 100.0]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [ss]

    - id: atan2_013
      description: 'x in [-100, -1], y in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL] linearstep'
      input:
      - [-max_subnormal, max_subnormal]
      - [-100.0, 1.0]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [ss]

    - id: atan2_014
      description: Test around 0, x is negativ, y is negative
      input:
      - [0x80000000, 0x80000FFF]
      - [0x80000000, 0x80000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [ss]

    - id: atan2_015
      description: Test around 0, x is positive, y is negative
      input:
      - [0x80000000, 0x80000FFF]
      - [0.0, 0x00000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [ss]

    - id: atan2_016
      description: Test around 0, x is negativ, y is positive
      input:
      - [0.0, 0x00000FFF]
      - [0x80000000, 0x80000FFF]
      type: [bitstep, bitstep]
      steps: [32, 32]
      variants : [ss]

    - id: atan2_017
      description: Test around 0, x is positive, y is positive
      input:
      - [0.0, 0x00000FFF]
      - [0.0, 0x00000FFF]
      type: [bitstep, bitstep]
      steps: [32, 32]
      variants : [ss]

    - id: atan2_018
      description: Test around -/- LARGEST_SUBNORMAL
      input:
      - [0x807ff000, 0x80800FFF]
      - [0x807ff000, 0x80800FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [ss]

    - id: atan2_019
      description: Test around -/+ LARGEST_SUBNORMAL
      input:
      - [0x807ff000, 0x80800FFF]
      - [0x007ff000, 0x00800fff]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [ss]

    - id: atan2_020
      description: Test around +/- LARGEST_SUBNORMAL
      input:
      - [0x007ff000, 0x00800fff]
      - [0x807ff000, 0x80800FFF]
      type: [bitstep, bitstep]
      steps: [64, 64]
      variants : [ss]

    - id: atan2_021
      description: Test around +/+ LARGEST_SUBNORMAL
      input:
      - [0x007ff000, 0x00800fff]
      - [0x007ff000, 0x00800fff]
      type: [bitstep, bitstep]
      steps: [64, 64]
      variants : [ss]

#Double precision
  - id: range-tests_01
    description: 'Full value distribution range tests'
    tests:
    - id: atan2_001
      description: 'y in [-DBL_MAX , -SMALLEST_SUBNORMAL], x in [-DBL_MAX , -SMALLEST_SUBNORMAL]'
      input:
      - [0xFFeFFFFFFFFFFFFF, -min_subnormal]
      - [0xFFeFFFFFFFFFFFFF, -min_subnormal]
      type: [expstep, expstep]
      steps: [400, 400]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_002
      description: 'y in [SMALLEST_SUBNORMAL, +DBL_MAX ], x in [-DBL_MAX , -SMALLEST_SUBNORMAL]'
      input:
      - [min_subnormal, max]
      - [0xFFeFFFFFFFFFFFFF, -min_subnormal]
      type: [expstep, expstep]
      steps: [400, 400]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_003
      description: 'y in [-DBL_MAX , -SMALLEST_SUBNORMAL], x in [SMALLEST_SUBNORMAL, +DBL_MAX ]'
      input:
      - [0xFFeFFFFFFFFFFFFF, -min_subnormal]
      - [min_subnormal, max]
      type: [expstep, expstep]
      steps: [400, 400]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_004
      description: 'Full value distribution range tests: y in [SMALLEST_SUBNORMAL, +DBL_MAX ], x in [SMALLEST_SUBNORMAL, +DBL_MAX ]'
      input:
      - [min_subnormal, max]
      - [min_subnormal, max]
      type: [expstep, expstep]
      steps: [400, 400]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_005
      description: 'Common value usage range tests: y, x in [-1, 0] linearstep'
      input:
      - [-1.0, 0.0]
      - [-1.0, 0.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [sd, vrd2, vrd4, vrd8]

  - id: normal-range
    description: 'Common value usage range tests'
    tests:
    - id: atan2_006
      description: 'y in [-1, 0], x in [0, +1] linearstep'
      input:
      - [-1.0, -0.0]
      - [-0.0, 1.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_007
      description: 'y in [0, +1], x in [-1, 0] linearstep'
      input:
      - [-0.0, 1.0]
      - [-1.0, 0.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_008
      description: 'y, x in [0, +1] linearstep'
      input:
      - [-0.0, 1.0]
      - [-0.0, 1.0]
      type: [linearstep, linearstep]
      steps: [1000, 1000]
      variants : [sd, vrd2, vrd4, vrd8]

  - id: subnormal-range
    description: 'Subnormal values range test'
    tests:
    - id: atan2_009
      description: 'y, x in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL] linearstep'
      input:
      - [0x800FFFFFFFFFFFFF, 0x000FFFFFFFFFFFFF]
      - [0x800FFFFFFFFFFFFF, 0x000FFFFFFFFFFFFF]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_010
      description: 'x in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL], y in [1, 100] linearstep'
      input:
      - [1.0, 100.0]
      - [0x800FFFFFFFFFFFFF, 0x000FFFFFFFFFFFFF]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_011
      description: 'x in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL], y in [-100, -1] linearstep'
      input:
      - [-100.0, -1.0]
      - [0x800FFFFFFFFFFFFF, 0x000FFFFFFFFFFFFF]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_012
      description: 'x in [1, 100], y in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL] linearstep'
      input:
      - [0x800FFFFFFFFFFFFF, 0x000FFFFFFFFFFFFF]
      - [1.0, 100.0]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_013
      description: 'x in [-100, -1], y in [-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL] linearstep'
      input:
      - [0x800FFFFFFFFFFFFF, 0x000FFFFFFFFFFFFF]
      - [-100.0, 1.0]
      type: [linearstep, linearstep]
      steps: [10, 10]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_014
      description: Test around 0, x is negativ, y is negative
      input:
      - [-0.0, 0x8000000000000FFF]
      - [-0.0, 0x8000000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_015
      description: Test around 0, x is positive, y is negative
      input:
      - [-0.0, 0x8000000000000FFF]
      - [0.0, 0x0000000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_016
      description: Test around 0, x is negativ, y is positive
      input:
      - [0.0, 0x0000000000000FFF]
      - [-0.0, 0x8000000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_017
      description: Test around 0, x is positive, y is positive
      input:
      - [0.0, 0x0000000000000FFF]
      - [0.0, 0x0000000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_018
      description: Test around (-LARGEST_SUBNORMAL, -LARGEST_SUBNORMAL)
      input:
      - [0x800FFFFFFFFFF000, 0x8010000000000FFF]
      - [0x800FFFFFFFFFF000, 0x8010000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_019
      description: Test around (-LARGEST_SUBNORMAL, LARGEST_SUBNORMAL)
      input:
      - [0x800FFFFFFFFFF000, 0x8010000000000FFF]
      - [0x000FFFFFFFFFF000, 0x0010000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_020
      description: Test around (LARGEST_SUBNORMAL, -LARGEST_SUBNORMAL)
      input:
      - [0x000FFFFFFFFFF000, 0x0010000000000FFF]
      - [0x800FFFFFFFFFF000, 0x8010000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

    - id: atan2_021
      description: Test around (LARGEST_SUBNORMAL, LARGEST_SUBNORMAL)
      input:
      - [0x000FFFFFFFFFF000, 0x0010000000000FFF]
      - [0x000FFFFFFFFFF000, 0x0010000000000FFF]
      type: [bitstep, bitstep]
      steps: [256, 256]
      variants : [sd, vrd2, vrd4, vrd8]

  - id: binade-zone-tests
    description: 'Binade zone accuracy tests (double precision, Q1: +y, +x)'
    tests:
    # Z0: subnormal ratio (0, 2^-1022)  subnormal scaling + linear path
    - id: atan2_z00
      description: 'Z0 subnormal ratio, x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x0000000000000001, 0x000FFFFFFFFFFFFF]
        type: linearstep
        steps: 500
        func: mul

    # Z1: ratio [2^-1022, 2^-768)  linear path (poly = r), 254 binades
    - id: atan2_z01
      description: 'Z1: ratio [2^-1022, 2^-768), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x0010000000000000, 0x0FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z2: ratio [2^-768, 2^-512)  linear path (poly = r), 256 binades
    - id: atan2_z02
      description: 'Z2: ratio [2^-768, 2^-512), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x0FF0000000000000, 0x1FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z3: ratio [2^-512, 2^-256)  linear path (poly = r), 256 binades
    - id: atan2_z03
      description: 'Z3: ratio [2^-512, 2^-256), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x1FF0000000000000, 0x2FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z4: ratio [2^-256, 2^-128)  linear path (poly = r), 128 binades
    - id: atan2_z04
      description: 'Z4: ratio [2^-256, 2^-128), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x2FF0000000000000, 0x37F0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z5: ratio [2^-128, 2^-64)  linear path (poly = r), 64 binades
    - id: atan2_z05
      description: 'Z5: ratio [2^-128, 2^-64), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x37F0000000000000, 0x3BF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z6: ratio [2^-64, 2^-32)  straddles tiny_r boundary, 32 binades
    - id: atan2_z06
      description: 'Z6: ratio [2^-64, 2^-32), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3BF0000000000000, 0x3DF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z7: ratio [2^-32, 2^-16)  poly j=0, above tiny_r, 16 binades
    - id: atan2_z07
      description: 'Z7: ratio [2^-32, 2^-16), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3DF0000000000000, 0x3EF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z8: ratio [2^-16, 2^-8)  poly j=0, 8 binades
    - id: atan2_z08
      description: 'Z8: ratio [2^-16, 2^-8), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3EF0000000000000, 0x3F70000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z9: ratio [2^-8, 2^-4)  poly j=0..3
    - id: atan2_z09
      description: 'Z9: ratio [2^-8, 2^-4), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3F70000000000000, 0x3FB0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z10: ratio [2^-4, 1.0)  polynomial path, no swap, j=4..63
    - id: atan2_z10
      description: 'Z10: ratio [2^-4, 1.0), poly no-swap, x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3FB0000000000000, 0x3FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z11: ratio [1.0, 2.0)  swap boundary, poly+swap, j=32..63
    - id: atan2_z11
      description: 'Z11: ratio [1.0, 2.0), swap boundary, x in [1, 5000]'
      input:
      - [derived, derived]
      - [1.0, 5000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [1.0, 2.0]
        type: expstep
        steps: 500
        func: mul

    # Z12: ratio [2.0, 8.0)  polynomial path + swap, j=8..32
    - id: atan2_z12
      description: 'Z12: ratio [2.0, 8.0), poly+swap, x in [1, 1250]'
      input:
      - [derived, derived]
      - [1.0, 1250.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [2.0, 8.0]
        type: expstep
        steps: 500
        func: mul

  # ====================================================================
  # Quadrant coverage tests
  # z sampled across all zones [subnormal, 2.0] in one sweep.
  # ====================================================================
  - id: quadrant-tests
    description: 'Quadrant coverage accuracy tests (double precision)'
    tests:
    # Q4: atan2(-y, +x)  — +x, neg_mul gives -y
    - id: atan2_q4
      description: 'Q4: y=-(x*z)<0, x>0, z in [subnormal, 2]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, random]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x0000000000000001, 2.0]
        type: expstep
        steps: 500
        func: neg_mul

    # Q3: atan2(-y, -x)  — -x, mul gives -y (since x<0, z>0)
    - id: atan2_q3
      description: 'Q3: y=x*z<0 (x<0), x<0, z in [subnormal, 2]'
      input:
      - [derived, derived]
      - [-10000.0, -1.0]
      type: [derived, random]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x0000000000000001, 2.0]
        type: expstep
        steps: 500
        func: mul

    # Q2: atan2(+y, -x)  — -x, neg_mul gives +y (negate of negative)
    - id: atan2_q2
      description: 'Q2: y=-(x*z)>0 (x<0), x<0, z in [subnormal, 2]'
      input:
      - [derived, derived]
      - [-10000.0, -1.0]
      type: [derived, random]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x0000000000000001, 2.0]
        type: expstep
        steps: 500
        func: neg_mul

  # ====================================================================
  # Sensitive-zone tests for the reduced-region scaling.
  # ====================================================================
  - id: sensitive-zone-tests
    description: 'Overflow and small-limit accuracy tests (double precision)'
    tests:
    # Reduced region at magnitudes where den*sqrt3 + num would overflow. The
    # ratio starts below 2-sqrt3 so the branch boundary itself is crossed.
    - id: atan2_ovf
      description: 'OVF: ratio [0.125, 1) across 2-sqrt3, x in [DBL_MAX/(1+sqrt3), DBL_MAX]'
      input:
      - [derived, derived]
      - [0x7FD76CF5D0B09954, 0x7FEFFFFFFFFFFFFF]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3FC0000000000000, 0x3FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Reduced region from subnormal up through 2^-1010.
    # Subnormal path, the widened upscale band, and the lanes just above SMALL_LIM.
    - id: atan2_und
      description: 'UND: ratio [0.25, 1), x in [2^-1074, 2^-1010] across SMALL_LIM'
      input:
      - [derived, derived]
      - [0x0000000000000001, 0x00D0000000000000]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd, vrd2, vrd4, vrd8]
      uth: ["2.5"]
      derived:
        range: [0x3FD0000000000000, 0x3FF0000000000000]
        type: expstep
        steps: 500
        func: mul






