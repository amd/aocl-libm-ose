---
- test_sequence: perf_tests_atan2_fast
  function: atan2
  timing_enabled: true
  test_sets:
  - id: binade-zone-tests
    description: 'Binade zone performance tests (double precision, Q1: +y, +x)'
    tests:
    # Z0: subnormal ratio (0, 2^-1022)  atan(r) ≈ r, subnormal region
    - id: atan2_z00
      description: 'Z0 subnormal ratio, x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x0000000000000001, 0x000FFFFFFFFFFFFF]
        type: linearstep
        steps: 500
        func: mul

    # Z1: ratio [2^-1022, 2^-768)  atan(r) ≈ r, deep linear
    - id: atan2_z01
      description: 'Z1: ratio [2^-1022, 2^-768), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x0010000000000000, 0x0FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z2: ratio [2^-768, 2^-512)  atan(r) ≈ r, deep linear
    - id: atan2_z02
      description: 'Z2: ratio [2^-768, 2^-512), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x0FF0000000000000, 0x1FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z3: ratio [2^-512, 2^-256)  atan(r) ≈ r, deep linear
    - id: atan2_z03
      description: 'Z3: ratio [2^-512, 2^-256), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x1FF0000000000000, 0x2FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z4: ratio [2^-256, 2^-128)  atan(r) ≈ r, deep linear
    - id: atan2_z04
      description: 'Z4: ratio [2^-256, 2^-128), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x2FF0000000000000, 0x37F0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z5: ratio [2^-128, 2^-64)  atan(r) ≈ r, deep linear
    - id: atan2_z05
      description: 'Z5: ratio [2^-128, 2^-64), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x37F0000000000000, 0x3BF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z6: ratio [2^-64, 2^-32)  atan(r) ≈ r, linear
    - id: atan2_z06
      description: 'Z6: ratio [2^-64, 2^-32), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x3BF0000000000000, 0x3DF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z7: ratio [2^-32, 2^-16)  atan(r) ≈ r, linear
    - id: atan2_z07
      description: 'Z7: ratio [2^-32, 2^-16), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x3DF0000000000000, 0x3EF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z8: ratio [2^-16, 2^-8)  atan(r) ≈ r − r³/3, near-linear
    - id: atan2_z08
      description: 'Z8: ratio [2^-16, 2^-8), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x3EF0000000000000, 0x3F70000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z9: ratio [2^-8, 2^-4)  atan(r) ≈ r − r³/3, near-linear
    - id: atan2_z09
      description: 'Z9: ratio [2^-8, 2^-4), x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x3F70000000000000, 0x3FB0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z10: ratio [2^-4, 1.0)  non-linear, atan curves toward π/4
    - id: atan2_z10
      description: 'Z10: ratio [2^-4, 1.0), poly no-swap, x in [1, 10000]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x3FB0000000000000, 0x3FF0000000000000]
        type: expstep
        steps: 500
        func: mul

    # Z11: ratio [1.0, 2.0)  near atan(1) = π/4, y ≈ x crossover
    - id: atan2_z11
      description: 'Z11: ratio [1.0, 2.0), swap boundary, x in [1, 5000]'
      input:
      - [derived, derived]
      - [1.0, 5000.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [1.0, 2.0]
        type: expstep
        steps: 500
        func: mul

    # Z12: ratio [2.0, 8.0)  atan2 approaching π/2, flattening
    - id: atan2_z12
      description: 'Z12: ratio [2.0, 8.0), poly+swap, x in [1, 1250]'
      input:
      - [derived, derived]
      - [1.0, 1250.0]
      type: [derived, expstep]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [2.0, 8.0]
        type: expstep
        steps: 500
        func: mul

  # ====================================================================
  # Quadrant coverage tests
  # z sampled across all zones [subnormal, 2.0] in one sweep.
  # ====================================================================
  - id: quadrant-tests
    description: 'Quadrant coverage performance tests (double precision)'
    tests:
    # Q4: atan2(-y, +x) ∈ (-π/2, 0), fourth quadrant
    - id: atan2_q4
      description: 'Q4: y=-(x*z)<0, x>0, z in [subnormal, 2]'
      input:
      - [derived, derived]
      - [1.0, 10000.0]
      type: [derived, random]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x0000000000000001, 2.0]
        type: expstep
        steps: 500
        func: neg_mul

    # Q3: atan2(-y, -x) ∈ (-π, -π/2), third quadrant
    - id: atan2_q3
      description: 'Q3: y=x*z<0 (x<0), x<0, z in [subnormal, 2]'
      input:
      - [derived, derived]
      - [-10000.0, -1.0]
      type: [derived, random]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x0000000000000001, 2.0]
        type: expstep
        steps: 500
        func: mul

    # Q2: atan2(+y, -x) ∈ (π/2, π), second quadrant
    - id: atan2_q2
      description: 'Q2: y=-(x*z)>0 (x<0), x<0, z in [subnormal, 2]'
      input:
      - [derived, derived]
      - [-10000.0, -1.0]
      type: [derived, random]
      steps: [500, 500]
      variants: [sd]
      uth: ["2.0"]
      warmup: 1000
      batch_size: 10000
      derived:
        range: [0x0000000000000001, 2.0]
        type: expstep
        steps: 500
        func: neg_mul
