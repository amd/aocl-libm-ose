- test_sequence: unit_tests_cexp
  ignore_exceptions: [underflow, inexact]
  function: cexp
  test_sets:
  - id: special-values
    description: Special values for complex exponential (from test_cexp_data.h)
    tests:

# Double precision (cexp) - 97 tests

    - id: cexp_001
      description: "cexp(0.0+0.0i)"
