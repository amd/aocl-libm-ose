- test_sequence: unit_tests_ldexp
  ignore_exceptions: [underflow, inexact]
  function: ldexp
  test_sets:
  - id: special-values
    description: Special values
    tests:
    # Test case 1: 0
    - id: ldexp_ss_001
      description: "ldexpf(0, 1) = 0"
      variants: [ss]
      input: [0x00000000, 1]
      expect: [0x00000000]
      expect_exception: []

    # Test case 2: -0
    - id: ldexp_ss_002
      description: "ldexpf(-0, 1) = -0"
      variants: [ss]
      input: [0x80000000, 1]
      expect: [0x80000000]
      expect_exception: []

    # Test case 3: inf
    - id: ldexp_ss_003
      description: "ldexpf(inf, 1) = inf"
      variants: [ss]
      input: [0x7f800000, 1]
      expect: [0x7f800000]
      expect_exception: []

    # Test case 4: -inf
    - id: ldexp_ss_004
      description: "ldexpf(-inf, 1) = -inf"
      variants: [ss]
      input: [0xff800000, 1]
      expect: [0xff800000]
      expect_exception: []

    # Test case 5: -nan
    - id: ldexp_ss_005
      description: "ldexpf(-nan, 1) = -nan"
      variants: [ss]
      input: [0xffc00000, 1]
      expect: [0xffc00000]
      expect_exception: []

    # Test case 6: +nan
    - id: ldexp_ss_006
      description: "ldexpf(+nan, 1) = +nan"
      variants: [ss]
      input: [0x7fc00000, 1]
      expect: [0x7fc00000]
      expect_exception: []

    # Test case 7: + subnorm (MAX)
    - id: ldexp_ss_007
      description: "ldexpf(+subnorm_max, 1) = normalized value"
      variants: [ss]
      input: [0x007fffff, 1]
      expect: [0x00fffffe]
      expect_exception: []

    # Test case 8: - subnorm (MAX)
    - id: ldexp_ss_008
      description: "ldexpf(-subnorm_max, 1) = -normalized value"
      variants: [ss]
      input: [0x807fffff, 1]
      expect: [0x80fffffe]
      expect_exception: []

    # Test case 9: + subnorm (MIN)
    - id: ldexp_ss_009
      description: "ldexpf(+subnorm_min, 1) = +subnorm_min * 2"
      variants: [ss]
      input: [0x00000001, 1]
      expect: [0x00000002]
      expect_exception: []

    # Test case 10: - subnorm (MIN)
    - id: ldexp_ss_010
      description: "ldexpf(-subnorm_min, 1) = -subnorm_min * 2"
      variants: [ss]
      input: [0x80000001, 1]
      expect: [0x80000002]
      expect_exception: []

    # Test case 11: + POS
    - id: ldexp_ss_011
      description: "ldexpf(1.0, 2) = 4.0"
      variants: [ss]
      input: [0x3f800000, 2]
      expect: [0x40800000]
      expect_exception: []

    # Test case 12: -POS
    - id: ldexp_ss_012
      description: "ldexpf(-1.0, 2) = -4.0"
      variants: [ss]
      input: [0xbf800000, 2]
      expect: [0xc0800000]
      expect_exception: []

    # Test case 13: +NEG
    - id: ldexp_ss_013
      description: "ldexpf(2.0, -1) = 1.0"
      variants: [ss]
      input: [0x40000000, -1]
      expect: [0x3f800000]
      expect_exception: []

    # Test case 14: -NEG
    - id: ldexp_ss_014
      description: "ldexpf(-2.0, -1) = -1.0"
      variants: [ss]
      input: [0xc0000000, -1]
      expect: [0xbf800000]
      expect_exception: []

    # Test case 15: qnan
    - id: ldexp_ss_015
      description: "ldexpf(qnan, 1) = qnan"
      variants: [ss]
      input: [0x7fc00000, 1]
      expect: [0x7fc00000]
      expect_exception: []

    # Test case 16: snan
    - id: ldexp_ss_016
      description: "ldexpf(snan, 1) = qnan (quieted, invalid raised)"
      variants: [ss]
      input: [0x7fa00000, 1]
      expect: [0x7FE00000]
      expect_exception: [invalidoperation]

# Test cases from gtests test_ldexp_data.h
#-------------------------------
    # ldexp exponent is an integer; second operand is the exponent value.
    - id: ldexp_ss_017
      description: "ldexpf(snan, 1) = qnan (quieted, invalid raised)"
      input: [0x7fa00000, 1]
      expect: [0x7fe00000]
      expect_exception: [invalidoperation]
      variants: [ss]

    - id: ldexp_ss_018
      description: "ldexpf(snan, 2) = qnan (quieted, invalid raised)"
      input: [0x7fa00000, 2]
      expect: [0x7fe00000]
      expect_exception: [invalidoperation]
      variants: [ss]

    - id: ldexp_ss_019
      description: "ldexpf(10.4, 10) = 10.4 * 2^10 (exact scale)"
      input: [0x41266666, 10]
      expect: [0x46266666]
      expect_exception: []
      variants: [ss]

    - id: ldexp_ss_020
      description: "ldexpf(0, 5) = 0"
      input: [0x00000000, 5]
      expect: [0x00000000]
      expect_exception: []
      variants: [ss]

    - id: ldexp_ss_021
      description: "ldexpf(+inf, 5) = +inf"
      input: [0x7f800000, 5]
      expect: [0x7f800000]
      expect_exception: []
      variants: [ss]

    - id: ldexp_ss_022
      description: "ldexpf(-0, -4) = -0"
      input: [0x80000000, -4]
      expect: [0x80000000]
      expect_exception: []
      variants: [ss]

#-------------------------------
    # Double precision tests
    # Test case 1: 0
    - id: ldexp_sd_001
      description: "ldexp(0, 1) = 0"
      variants: [sd]
      input: [0x0000000000000000, 1]
      expect: [0x0000000000000000]
      expect_exception: []

    # Test case 2: -0
    - id: ldexp_sd_002
      description: "ldexp(-0, 1) = -0"
      variants: [sd]
      input: [0x8000000000000000, 1]
      expect: [0x8000000000000000]
      expect_exception: []

    # Test case 3: inf
    - id: ldexp_sd_003
      description: "ldexp(inf, 1) = inf"
      variants: [sd]
      input: [0x7ff0000000000000, 1]
      expect: [0x7ff0000000000000]
      expect_exception: []

    # Test case 4: -inf
    - id: ldexp_sd_004
      description: "ldexp(-inf, 1) = -inf"
      variants: [sd]
      input: [0xfff0000000000000, 1]
      expect: [0xfff0000000000000]
      expect_exception: []

    # Test case 5: -nan
    - id: ldexp_sd_005
      description: "ldexp(-nan, 1) = -nan"
      variants: [sd]
      input: [0xfff8000000000000, 1]
      expect: [0xfff8000000000000]
      expect_exception: []

    # Test case 6: +nan
    - id: ldexp_sd_006
      description: "ldexp(+nan, 1) = +nan"
      variants: [sd]
      input: [0x7ff8000000000000, 1]
      expect: [0x7ff8000000000000]
      expect_exception: []

    # Test case 7: + subnorm (MAX)
    - id: ldexp_sd_007
      description: "ldexp(+subnorm_max, 1) = normalized value"
      variants: [sd]
      input: [0x000fffffffffffff, 1]
      expect: [0x001ffffffffffffe]
      expect_exception: []

    # Test case 8: - subnorm (MAX)
    - id: ldexp_sd_008
      description: "ldexp(-subnorm_max, 1) = -normalized value"
      variants: [sd]
      input: [0x800fffffffffffff, 1]
      expect: [0x801ffffffffffffe]
      expect_exception: []

    # Test case 9: + subnorm (MIN)
    - id: ldexp_sd_009
      description: "ldexp(+subnorm_min, 1) = +subnorm_min * 2"
      variants: [sd]
      input: [0x0000000000000001, 1]
      expect: [0x0000000000000002]
      expect_exception: []

    # Test case 10: - subnorm (MIN)
    - id: ldexp_sd_010
      description: "ldexp(-subnorm_min, 1) = -subnorm_min * 2"
      variants: [sd]
      input: [0x8000000000000001, 1]
      expect: [0x8000000000000002]
      expect_exception: []

    # Test case 11: + POS
    - id: ldexp_sd_011
      description: "ldexp(1.0, 2) = 4.0"
      variants: [sd]
      input: [0x3ff0000000000000, 2]
      expect: [0x4010000000000000]
      expect_exception: []

    # Test case 12: -POS
    - id: ldexp_sd_012
      description: "ldexp(-1.0, 2) = -4.0"
      variants: [sd]
      input: [0xbff0000000000000, 2]
      expect: [0xc010000000000000]
      expect_exception: []

    # Test case 13: +NEG
    - id: ldexp_sd_013
      description: "ldexp(2.0, -1) = 1.0"
      variants: [sd]
      input: [0x4000000000000000, -1]
      expect: [0x3ff0000000000000]
      expect_exception: []

    # Test case 14: -NEG
    - id: ldexp_sd_014
      description: "ldexp(-2.0, -1) = -1.0"
      variants: [sd]
      input: [0xc000000000000000, -1]
      expect: [0xbff0000000000000]
      expect_exception: []

    # Test case 15: qnan
    - id: ldexp_sd_015
      description: "ldexp(qnan, 1) = qnan"
      variants: [sd]
      input: [0x7ff8000000000000, 1]
      expect: [0x7ff8000000000000]
      expect_exception: []

    # Test case 16: snan
    - id: ldexp_sd_016
      description: "ldexp(snan, 1) = qnan (quieted, invalid raised)"
      variants: [sd]
      input: [0x7ff4000000000001, 1]
      expect: [0x7FFC000000000001]
      expect_exception: [invalidoperation]

# Test cases from gtests test_ldexp_data.h
#-------------------------------
    # ldexp exponent is an integer; second operand is the exponent value.
    - id: ldexp_sd_017
      description: "ldexp(snan, 1) = qnan (quieted, invalid raised)"
      input: [0x7FF4001000000000, 1]
      expect: [0x7FFC001000000000]
      expect_exception: [invalidoperation]
      variants: [sd]

    - id: ldexp_sd_018
      description: "ldexp(snan, 2) = qnan (quieted, invalid raised)"
      input: [0x7FF4001000000000, 2]
      expect: [0x7FFC001000000000]
      expect_exception: [invalidoperation]
      variants: [sd]

    - id: ldexp_sd_019
      description: "ldexp(88.2, 88) = 88.2 * 2^88 (exact scale)"
      input: [0x40560CCCCCCCCCCD, 88]
      expect: [0x45D60CCCCCCCCCCD]
      expect_exception: []
      variants: [sd]

    - id: ldexp_sd_020
      description: "ldexp(0, 88) = 0"
      input: [0x0000000000000000, 88]
      expect: [0x0000000000000000]
      expect_exception: []
      variants: [sd]

    - id: ldexp_sd_021
      description: "ldexp(+inf, 88) = +inf"
      input: [0x7ff0000000000000, 88]
      expect: [0x7ff0000000000000]
      expect_exception: []
      variants: [sd]

    - id: ldexp_sd_022
      description: "ldexp(-0, -4) = -0"
      input: [0x8000000000000000, -4]
      expect: [0x8000000000000000]
      expect_exception: []
      variants: [sd]
#-------------------------------