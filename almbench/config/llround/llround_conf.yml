---
- test_sequence: unit_tests_llround
  ignore_exceptions: [underflow, inexact]
  function: llround
  test_sets:
  - id: special-values
    description: Special values (scalar); shim packs long long in float/double op[0]
    tests:
    - id: llround_001
      description: "llroundf(0) = 0"
      api_name: llround
      variants: [ss]
      input: [0x00000000]
      expect: [0x00000000]
      expect_exception: []

    - id: llround_002
      description: "llroundf(-0) = 0 (packed as +0)"
      api_name: llround
      variants: [ss]
      input: [0x80000000]
      expect: [0x00000000]
      expect_exception: []

    - id: llround_003
      description: "llroundf(+inf) invalid; oracle LLONG_MIN as float"
      api_name: llround
      variants: [ss]
      input: [0x7f800000]
      expect: [0xdf000000]
      expect_exception: [invalidoperation]

    - id: llround_004
      description: "llroundf(-inf) invalid; oracle LLONG_MIN as float"
      api_name: llround
      variants: [ss]
      input: [0xff800000]
      expect: [0xdf000000]
      expect_exception: [invalidoperation]

    - id: llround_005
      description: "llroundf(-qnan) invalid; oracle LLONG_MIN as float"
