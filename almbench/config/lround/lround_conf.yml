---
- test_sequence: unit_tests_lround
  ignore_exceptions: [underflow, inexact]
  function: lround
  test_sets:
  - id: special-values
    description: Special values (scalar);
    tests:
    - id: lround_001
      description: "lroundf(0) = 0"
      api_name: lround
      variants: [ss]
      input: [0x00000000]
      expect: [0x00000000]
      expect_exception: []

    - id: lround_002
      description: "lroundf(-0) = 0 (packed as +0)"
      api_name: lround
      variants: [ss]
      input: [0x80000000]
      expect: [0x00000000]
      expect_exception: []

    - id: lround_003
      description: "lroundf(+inf) invalid; oracle LONG_MIN as float"
      api_name: lround
      variants: [ss]
      input: [0x7f800000]
      expect: [0xdf000000]
      expect_exception: [invalidoperation]

    - id: lround_004
